<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · CoShare</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f6f1e7;
        color: #1b1a17;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        border: 1px solid rgba(27, 26, 23, 0.12);
        border-radius: 24px;
        padding: 22px;
        background: rgba(255, 255, 255, 0.75);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        line-height: 1.5;
        opacity: 0.75;
      }
      a {
        color: #c23c2a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>CoShare needs a connection to load recipes. Reconnect, then try again.</p>
      <p style="margin-top: 14px"><a href="/">Back home</a></p>
    </div>
  </body>
</html>
